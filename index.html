<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom Scientific Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#10151b;--panel:#19212b;--display:#080c11;--key:#25303c;--key-hover:#344252;--operator:#22506a;--text:#f3f6f8;--muted:#91a0af;--accent:#54d6b1;--danger:#ff7d87;--border:#334251;}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#20333d 0,#10151b 38%,#0c1015 100%);color:var(--text);font-family:'Space Grotesk',sans-serif;padding:28px}.app{width:min(1100px,100%);margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:13px}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--accent);color:var(--accent);font-weight:700;letter-spacing:-2px}.brand h1{font-size:20px;letter-spacing:3px;margin:0}.brand p{font-size:10px;color:var(--muted);letter-spacing:2px;margin:4px 0 0}.angle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px}.angle button{border:1px solid var(--border);background:var(--key);color:var(--muted);padding:8px 12px;font:inherit;cursor:pointer}.angle button.active{background:var(--operator);color:var(--accent);border-color:var(--accent)}.display{background:var(--display);border:1px solid var(--border);padding:15px 22px 19px;margin-bottom:18px;box-shadow:0 12px 35px #0005}.status{color:var(--muted);font-size:11px;text-align:right;height:18px}.expression{width:100%;background:transparent;border:0;outline:0;color:var(--text);font:500 26px 'DM Mono',monospace;text-align:right;padding:10px 0}.result{color:var(--accent);font:500 clamp(28px,5vw,42px) 'DM Mono',monospace;text-align:right;min-height:52px;overflow:auto}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.key{min-height:57px;border:0;background:var(--key);color:var(--text);font:600 15px 'Space Grotesk',sans-serif;cursor:pointer;transition:transform .12s,background .12s}.key:hover{background:var(--key-hover);transform:translateY(-2px)}.key:active{transform:translateY(0)}.function{color:var(--accent)}.operator{background:var(--operator)}.utility{color:var(--muted);font-size:12px}.danger{color:var(--danger)}.equals{background:var(--accent);color:#071611;font-size:22px}.history{background:var(--panel);border:1px solid var(--border);padding:16px;min-height:100%}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.history h2{font-size:12px;letter-spacing:2px;margin:0}.clear-history{background:none;border:0;color:var(--muted);font:11px inherit;cursor:pointer}.clear-history:hover{color:var(--danger)}.history-list{list-style:none;padding:0;margin:0;max-height:465px;overflow:auto}.history-list li{border-bottom:1px solid var(--border);padding:12px 4px;cursor:pointer}.history-list li:hover{background:#ffffff08}.history-list .formula{color:var(--muted);font:12px 'DM Mono',monospace;overflow-wrap:anywhere}.history-list .answer{color:var(--accent);font:14px 'DM Mono',monospace;margin-top:5px}.empty{color:var(--muted);font-size:12px;line-height:1.6;padding:12px 4px}.hint{text-align:center;color:var(--muted);font-size:11px;margin:16px 0 0;letter-spacing:.3px}@media(max-width:760px){body{padding:16px}.topbar{align-items:flex-start;gap:15px}.brand h1{font-size:17px}.angle{flex-wrap:wrap;justify-content:flex-end}.workspace{grid-template-columns:1fr}.history{min-height:160px}.history-list{max-height:160px}.key{min-height:50px}.expression{font-size:20px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><div class="mark">A×</div><div><h1>AXIOM</h1><p>SCIENTIFIC CALCULATOR</p></div></div><div class="angle"><span>ANGLE</span><button data-angle="DEG" class="active">DEG</button><button data-angle="RAD">RAD</button></div></header>
<section class="display"><div class="status" id="status">Ready</div><input id="expression" class="expression" autocomplete="off" spellcheck="false" aria-label="Expression"><div id="result" class="result">0</div></section>
<section class="workspace"><div><div class="keypad" id="keypad">
<button class="key utility" data-action="memory-clear">MC</button><button class="key utility" data-action="memory-recall">MR</button><button class="key utility" data-action="memory-add">M+</button><button class="key utility" data-action="memory-subtract">M-</button><button class="key danger" data-action="clear">AC</button><button class="key danger" data-action="delete">DEL</button>
<button class="key function" data-value="sin(">sin</button><button class="key function" data-value="cos(">cos</button><button class="key function" data-value="tan(">tan</button><button class="key function" data-value="ln(">ln</button><button class="key function" data-value="log(">log</button><button class="key function" data-value="sqrt(">sqrt</button>
<button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key" data-value="(">(</button><button class="key" data-value=")">)</button><button class="key operator" data-value="/">/</button>
<button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="^">^</button><button class="key operator" data-value="%">%</button><button class="key operator" data-value="*">*</button>
<button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key function" data-value="pi">pi</button><button class="key function" data-value="e">e</button><button class="key operator" data-value="-">-</button>
<button class="key" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key function" data-value="Ans">Ans</button><button class="key operator" data-value="+">+</button><button class="key equals" data-action="equals" style="grid-column:span 2">=</button>
</div><div class="hint">Enter to calculate &middot; Escape to clear &middot; Click history to reuse</div></div>
<aside class="history"><div class="history-head"><h2>HISTORY</h2><button id="clearHistory" class="clear-history">CLEAR</button></div><ul id="historyList" class="history-list"><li class="empty">Your calculations will appear here.</li></ul></aside></section>
</main>
<script>
const expression=document.getElementById('expression'), result=document.getElementById('result'), statusText=document.getElementById('status'), historyList=document.getElementById('historyList');
let angle='DEG', answer=0, memory=0, history=[];
const functions={sin:x=>Math.sin(angle==='DEG'?x*Math.PI/180:x),cos:x=>Math.cos(angle==='DEG'?x*Math.PI/180:x),tan:x=>Math.tan(angle==='DEG'?x*Math.PI/180:x),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp};
function calculate(text){let source=text.replace(/\^/g,'**').replace(/\bpi\b/gi,'PI');let names=['PI','E','Ans',...Object.keys(functions)];let values=[Math.PI,Math.E,answer,...Object.values(functions)];return Function(...names,'"use strict"; return '+source)(...values)}
function format(value){if(Number.isInteger(value))return value.toLocaleString();return Number(value.toPrecision(12)).toLocaleString(undefined,{maximumSignificantDigits:12})}
function insert(value){expression.value+=value;expression.focus();statusText.textContent='Editing expression'}
function clearAll(){expression.value='';result.textContent='0';statusText.textContent='Ready';expression.focus()}
function evaluate(){let text=expression.value.trim();if(!text)return;try{let value=calculate(text);if(!Number.isFinite(value))throw Error();answer=value;let formatted=format(value);result.textContent=formatted;statusText.textContent=angle+'  |  Calculated';history.unshift({text,formatted});renderHistory();expression.value='';}catch(error){result.textContent='Error';statusText.textContent='Check expression';}}
function renderHistory(){historyList.innerHTML='';if(!history.length){historyList.innerHTML='<li class="empty">Your calculations will appear here.</li>';return}history.slice(0,30).forEach(item=>{let li=document.createElement('li');li.innerHTML='<div class="formula"></div><div class="answer"></div>';li.querySelector('.formula').textContent=item.text;li.querySelector('.answer').textContent='= '+item.formatted;li.onclick=()=>{expression.value=item.text;expression.focus();statusText.textContent='Expression recalled'};historyList.appendChild(li)})}
function memoryAction(action){if(action==='memory-clear')memory=0;if(action==='memory-recall')insert(format(memory).replaceAll(',',''));if(action==='memory-add')memory+=answer;if(action==='memory-subtract')memory-=answer;statusText.textContent=action==='memory-clear'?'Memory cleared':'Memory updated'}
document.getElementById('keypad').addEventListener('click',event=>{let button=event.target.closest('button');if(!button)return;let action=button.dataset.action;if(action==='equals')return evaluate();if(action==='clear')return clearAll();if(action==='delete'){expression.value=expression.value.slice(0,-1);return}if(action?.startsWith('memory'))return memoryAction(action);insert(button.dataset.value)});
document.querySelectorAll('[data-angle]').forEach(button=>button.onclick=()=>{angle=button.dataset.angle;document.querySelectorAll('[data-angle]').forEach(item=>item.classList.toggle('active',item===button));statusText.textContent='Angle mode: '+angle;expression.focus()});
document.getElementById('clearHistory').onclick=()=>{history=[];renderHistory()};
expression.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();evaluate()}if(event.key==='Escape')clearAll()});
</script>
</body>
</html>
